<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<!-- Cloudflare Pages serves this for any unknown path, nested ones too: resolve links from the root. -->
<base href="/"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="theme-color" content="#f9f7f1"/>
<title>Page not found | fudami</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="assets/favicon.png"/>
<link rel="apple-touch-icon" href="assets/favicon.png"/>
<link rel="stylesheet" href="vendor/fonts/fonts.css"/>
<link rel="stylesheet" href="design-system.css"/>
<script>
  (function(){
    var s=localStorage.getItem('fudami-theme');
    var d=s?s==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', d);
    document.documentElement.classList.toggle('light', !d);
  })();
</script>
<script src="vendor/fudami-design.browser.js" defer></script>
<script src="components.js" defer></script>
<script src="shared.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    injectHeader('');
    injectFooter();
  });
</script>
</head>

<body class="antialiased min-h-screen flex flex-col font-sans text-body-md">

<main class="flex-grow pt-24 md:pt-32 pb-24 px-6 md:px-8 w-full max-w-[800px] mx-auto text-center">
  <p class="text-hanko-red font-bold text-sm tracking-wider uppercase mb-3">404</p>
  <h1 class="text-3xl md:text-5xl text-washi-light font-bold mb-4 tracking-tight">This page doesn't exist.</h1>
  <p class="text-lg text-washi-light/70 mb-8">It may have moved, or the link is mistyped.</p>
  <a href="index.html" class="text-hanko-red font-bold">Back to the home page &rarr;</a>
</main>

</body>
</html>
